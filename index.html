<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Live score dashboard</title>
</head>
<body>
    <main class="container">

        <nav class="navigation" >
            <div><button onclick= ShowContent(0) >todays matches</button></div>
            <div><button onclick= ShowContent(1) >live score board</button></div>    
            <div><button onclick= ShowContent(2) >live matches</button></div>    
        </nav>

        <section class="matches" id="matches" aria-labelledby="scoreboard-title">

        </section>

        <section class="matches" id="live_matches" aria-labelledby="scoreboard-title">

        </section>

        <section class="scoreboard" aria-labelledby="scoreboard-title" style="display: block">
            <div class="scoreboard__topline">
                <p class="live-badge" >Live</p>
                <p class="time" id="current-time">--:--:--</p>
            </div>

            <h1 id="scoreboard-title">Score dashboard</h1>

            <div class="main_scoring" aria-live="polite">
                <article class="team-panel">
                    <h4 class="name_home" id="home-name-display">Home</h4>
                    <h1 class="score_home" id="home-score">0</h1>
                </article>

                <h3 class="team-panel" id="divided" aria-hidden="true">:</h3>

                <article class="team-panel">
                    <h4 class="name_away" id="away-name-display">away</h4>
                    <h1 class="score_away" id="away-score">0</h1>
                </article>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
